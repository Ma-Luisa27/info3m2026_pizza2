{% extends 'base.html' %}

{% block titulo %} Nova pizza {% endblock %}

{% block conteudo %}
<div class="min-h-screen bg-base-200 px-4 py-10 sm:px-6 lg:px-8">
    <form action="{{ url_for('pizza.add') }}" method="POST" class="card mx-auto max-w-xl border border-base-300 bg-base-100 shadow-sm">
        <div class="card-body gap-5">
            <div class="mb-2">
                <h1 class="card-title text-2xl">Nova pizza</h1>
                <p class="mt-1 text-sm text-base-content/60">Preencha os dados para adicionar um sabor ao cardápio.</p>
            </div>
            <label class="form-control gap-2"><span class="label-text font-medium">Sabor</span><input class="input input-bordered w-full" type="text" name="sabor" placeholder="Ex.: Calabresa" required></label>
            <label class="form-control gap-2"><span class="label-text font-medium">Preço</span><input class="input input-bordered w-full" type="number" name="preco" min="0" step="0.01" placeholder="0,00" required></label>
            <label class="form-control gap-2"><span class="label-text font-medium">Imagem da pizza</span><input class="input input-bordered w-full" type="url" name="imagem" placeholder="https://exemplo.com/pizza.jpg"><span class="label-text-alt mt-1">Informe o endereço de uma imagem online.</span></label>
            <div class="card-actions justify-end"><a href="{{ url_for('pizza.get') }}" class="btn btn-ghost">Cancelar</a><button type="submit" class="btn btn-primary">Cadastrar pizza</button></div>
        </div>
    </form>
</div>
{% endblock %}
