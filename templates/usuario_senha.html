{% extends 'base.html' %}

{% block titulo %} Alterar senha {% endblock %}

{% block conteudo %}
<main class="min-h-screen bg-base-200 px-4 py-10 sm:px-6 lg:px-8">
  <form action="{{ url_for('usuario.alterar_senha') }}" method="POST" class="card mx-auto max-w-xl border border-base-300 bg-base-100 shadow-sm">
    <div class="card-body gap-5">
      <div class="mb-2">
        <h1 class="card-title text-2xl">Alterar senha</h1>
        <p class="mt-1 text-sm text-base-content/60">Confirme seus dados para cadastrar uma nova senha.</p>
      </div>
      <label class="form-control gap-2"><span class="label-text font-medium">E-mail</span><input class="input input-bordered w-full" type="email" name="email" autocomplete="email" required></label>
      <label class="form-control gap-2"><span class="label-text font-medium">Senha atual</span><input class="input input-bordered w-full" type="password" name="senha_atual" autocomplete="current-password" required></label>
      <label class="form-control gap-2"><span class="label-text font-medium">Nova senha</span><input class="input input-bordered w-full" type="password" name="nova_senha" autocomplete="new-password" required></label>
      <label class="form-control gap-2"><span class="label-text font-medium">Confirmar nova senha</span><input class="input input-bordered w-full" type="password" name="confirmacao" autocomplete="new-password" required></label>
      <div class="card-actions justify-end"><a href="{{ url_for('index') }}" class="btn btn-ghost">Cancelar</a><button type="submit" class="btn btn-primary">Alterar senha</button></div>
    </div>
  </form>
</main>
{% endblock %}
