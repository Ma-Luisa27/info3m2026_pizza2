{% extends 'base.html' %}

{% block titulo %} Login {% endblock %}

{% block conteudo %}
        <main class="min-h-screen bg-base-200 px-4 py-16 sm:px-6 lg:px-8">
            <div class="mx-auto max-w-md">
                <div class="mb-8 text-center">
                    <p class="text-sm font-semibold uppercase tracking-[0.2em] text-primary">Pizza Nossa!</p>
                    <h1 class="mt-3 text-3xl font-bold">Acesse sua conta</h1>
                    <p class="mt-2 text-base-content/70">Entre para gerenciar pizzas, usuários e pedidos.</p>
                </div>

                <form action="{{ url_for('login') }}" method="post" class="rounded-box border border-base-300 bg-base-100 p-6 shadow-sm sm:p-8">
                    <div class="space-y-4">
                        <label class="form-control w-full">
                            <span class="label-text mb-2 font-medium">E-mail</span>
                            <input type="email" name="email" class="input input-bordered w-full" placeholder="voce@exemplo.com" autocomplete="email" required autofocus />
                        </label>

                        <label class="form-control w-full">
                            <span class="label-text mb-2 font-medium">Senha</span>
                            <input type="password" name="senha" class="input input-bordered w-full" placeholder="Digite sua senha" autocomplete="current-password" required />
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary mt-6 w-full">Entrar</button>
                </form>
            </div>
        </main>

{% endblock %}
