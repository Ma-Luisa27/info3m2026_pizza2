{% extends 'base.html' %}

{% block titulo %} Editar usuário {% endblock %}

{% block conteudo %}

<div class="min-h-screen bg-base-200 px-4 py-10 sm:px-6 lg:px-8">
  <form action="{{url_for('usuario.update', id=u.id)}}" method="POST" class="card mx-auto max-w-xl border border-base-300 bg-base-100 shadow-sm">
    <div class="card-body">
      <h1 class="card-title text-2xl">Editar usuário</h1>
      <label class="form-control"><span class="label-text">Nome</span><input class="input input-bordered" type="text" name="nome" value="{{u.nome}}" required></label>
      <label class="form-control"><span class="label-text">E-mail</span><input class="input input-bordered" type="email" name="email" value="{{u.email}}" required></label>
      <label class="form-control"><span class="label-text">Senha</span><input class="input input-bordered" type="password" name="senha" value="{{u.senha}}" required></label>
      <div class="card-actions justify-end"><a href="{{ url_for('usuario.get') }}" class="btn btn-ghost">Cancelar</a><button type="submit" class="btn btn-primary">Salvar alterações</button></div>
    </div>
  </form>
</div>

{% endblock %}
